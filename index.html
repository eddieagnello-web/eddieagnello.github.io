<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata about the webpage -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section of the webpage -->
    <header>
        <h1>Welcome to My Website!</h1>
        <p>Built with HTML, CSS, and JavaScript, hosted on GitHub Pages.</p>
    </header>

    <!-- Main content container -->
    <main>
        <section class="card">
            <h2>Hello, World!</h2>
            <p>This is your brand new starter template. Click the button below to see JavaScript in action!</p>
            <!-- Interactive button -->
            <button id="colorBtn">Click Me!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <!-- Link to our external JavaScript file for interactivity -->
    <script src="script.js"></script>
</body>
</html>
