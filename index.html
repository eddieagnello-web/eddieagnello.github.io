<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Awesome Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Welcome to My Website!</h1>
    <p>Built from scratch using HTML, CSS, and JavaScript.</p>
    <button id="themeToggleBtn">🌙 Switch to Dark Mode</button>
  </header>

  <main>
    <section class="card">
      <h2>About Me</h2>
      <p>Hi there! I'm creating my very first website hosted on GitHub Pages.</p>
      <button id="magicBtn">Click Me for Magic!</button>
      <p id="message"></p>
    </section>

    <section class="card game-section">
      <h2>⛳ Mini-Golf Challenge</h2>
      <p>Click on the green green to aim and shoot your ball into the hole!</p>
      
      <canvas id="golfCanvas" width="400" height="300"></canvas>
      
      <div class="game-stats">
        <p>Strokes: <span id="strokeCounter">0</span></p>
        <button id="resetGameBtn">🔄 Reset Hole</button>
      </div>
      <p id="gameStatusMessage"></p>
    </section>
  </main>

  <footer>
    <p>Created with 💙 by a Web Developer</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
