<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Awesome Website - Flappy Bird</title>
  
  <style>
    /* Page Styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    header {
      background-color: #4a90e2;
      color: white;
      width: 100%;
      text-align: center;
      padding: 2rem 1rem;
    }

    main {
      width: 90%;
      max-width: 600px;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: white;
      color: #333333;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    button {
      background-color: #4a90e2;
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin: 0.5rem;
    }

    button:hover {
      background-color: #357abd;
      transform: scale(1.03);
    }

    #gameStatusMessage {
      margin-top: 1rem;
      font-weight: bold;
      color: #2e7d32;
    }

    /* Flappy Canvas Styling */
    #flappyCanvas {
      background-color: #70c5ce;
      border-radius: 10px;
      border: 4px solid #4a90e2;
      cursor: pointer;
      max-width: 100%;
      touch-action: manipulation;
    }

    .game-stats {
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-weight: bold;
      margin-top: 0.5rem;
      font-size: 1.1rem;
    }

    footer {
      margin-top: auto;
      padding: 1rem;
      color: #777777;
    }

    /* Dark Mode */
    body.dark-mode {
      background-color: #0a192f;
      color: #ffffff;
    }

    body.dark-mode .card {
      background-color: #112240;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website!</h1>
    <p>Built from scratch using HTML, CSS, and JavaScript.</p>
    <button id="themeToggleBtn">🌙 Switch to Dark Mode</button>
  </header>

  <main>
    <section class="card game-section">
      <h2>🐤 Flappy Bird</h2>
      <p>Click the game area or press <strong>Spacebar</strong> to flap!</p>
      
      <canvas id="flappyCanvas" width="360" height="480"></canvas>
      
      <div class="game-stats">
        <p>Score: <span id="scoreDisplay">0</span></p>
        <p>Best: <span id="highScoreDisplay">0</span></p>
        <button id="restartGameBtn">🎮 Start / Restart</button>
      </div>
      <p id="gameStatusMessage">Click or press Spacebar to fly!</p>
    </section>
  </main>

  <footer>
    <p>Created with 💙 by a Web Developer</p>
  </footer>

  <script>

      // Theme Toggle
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", () => {
          document.body.classList.toggle("dark-mode");
          themeToggleBtn.textContent = document.body.classList.contains("dark-mode")
            ? "☀️ Switch to Light Mode"
            : "🌙 Switch to Dark Mode";
        });

          gameStatusMessage.textContent = "Flying!";
